<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>운동 기록 | CampusFit</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html"><span class="brand-mark">CF</span><span>CampusFit</span></a>
      <nav class="top-nav" aria-label="주요 내비게이션">
        <a href="index.html">홈</a>
        <a href="diet.html">식단 기록</a>
        <a href="body.html">신체 프로필</a>
        <a class="active" href="workout.html">운동 기록</a>
        <a href="dashboard.html">대시보드</a>
        <a href="calendar.html">캘린더</a>
        <a href="login.html">로그인</a>
      </nav>
      <div id="accountStatus" class="account-status"></div>
    </header>

    <main class="page-shell">
      <section class="page-title">
        <p class="eyebrow">운동 기록</p>
        <h1>운동 볼륨을 계산하고 훈련 변화를 비교합니다.</h1>
        <p id="dailyDateLabel" class="date-note"></p>
      </section>

      <section class="summary-grid three">
        <div class="metric-card"><span>오늘의 볼륨</span><strong id="workoutTotal">0</strong><small>kg</small></div>
        <div class="metric-card"><span>운동 종류</span><strong id="exerciseCount">0</strong><small>개</small></div>
        <div class="metric-card"><span>최고 변화량</span><strong id="bestChange">0</strong><small>kg</small></div>
      </section>

      <section class="panel">
        <h2>운동별 볼륨</h2>
        <div id="exerciseVolumeList" class="exercise-volume-list"></div>
      </section>

      <section class="two-column">
        <article class="panel">
          <h2>운동 추가</h2>
          <form id="workoutForm" class="form-grid">
            <label class="full-row">
              운동명
              <input id="exerciseName" type="text" placeholder="벤치프레스" required />
            </label>
            <label>
              무게 (kg)
              <input id="exerciseWeight" type="number" min="0" step="0.5" required />
            </label>
            <label>
              반복 횟수
              <input id="exerciseReps" type="number" min="1" step="1" required />
            </label>
            <label>
              세트 수
              <input id="exerciseSets" type="number" min="1" step="1" required />
            </label>
            <button class="button primary full-row" type="submit">운동 추가</button>
          </form>
        </article>

        <article class="panel result-panel">
          <h2>기록 비교</h2>
          <p id="workoutFeedback" class="feedback">운동을 추가하면 이전 기록과 비교됩니다.</p>
          <button id="clearWorkouts" class="button danger" type="button">운동 기록 비우기</button>
        </article>
      </section>

      <section class="panel">
        <h2>오늘의 운동 기록</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>운동</th>
                <th>무게</th>
                <th>반복</th>
                <th>세트</th>
                <th>볼륨</th>
                <th>변화</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="workoutTable"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
